services:
  immich-mcp:
    build:
      context: .
      args:
        # Update the Immich SDK/spec at build time. Examples:
        #   IMMICH_SDK_VERSION=latest docker compose build
        #   IMMICH_SDK_VERSION=3.3.0 docker compose build
        IMMICH_SDK_VERSION: ${IMMICH_SDK_VERSION:-}
        # Force a fresh spec download even if the layer cache is warm:
        #   IMMICH_REFRESH=$(date +%s) docker compose build
        IMMICH_REFRESH: ${IMMICH_REFRESH:-}
    image: immich-mcp:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Point this at your Immich server. From inside the container use the
      # host-reachable address, e.g. http://host.docker.internal:2283/api on Docker Desktop.
      IMMICH_BASE_URL: ${IMMICH_BASE_URL:-http://host.docker.internal:2283/api}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      IMMICH_MCP_TRANSPORT: http
      IMMICH_MCP_HTTP_HOST: 0.0.0.0
      IMMICH_MCP_HTTP_PORT: "3000"
      # Strongly recommended when exposing the HTTP endpoint:
      IMMICH_MCP_HTTP_AUTH_TOKEN: ${IMMICH_MCP_HTTP_AUTH_TOKEN:-}
      IMMICH_MCP_DOWNLOAD_DIR: /data/downloads
      IMMICH_MCP_LOG_LEVEL: ${IMMICH_MCP_LOG_LEVEL:-info}
    volumes:
      - immich-mcp-downloads:/data/downloads

volumes:
  immich-mcp-downloads:
